name: Build iOS

on:
  pull_request:
    paths:
      - 'ios-app/**'
      - 'ios-live-activity/**'
      - 'rust-core/**'
      - 'project.yml'
      - 'build-rust.sh'
      - '.github/workflows/build-ios.yml'
  push:
    branches: [feature/shortcuts-refresh-all]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and Rust targets
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ios-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-core/Cargo.lock', 'rust-core/Cargo.toml', 'rust-core/vendor/**/Cargo.toml') }}
      - name: Build the existing Rust FFI
        run: bash build-rust.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app and extract App Intents metadata
        run: |
          set -o pipefail
          xcodebuild -project SideInstaller.xcodeproj -scheme SideInstaller \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-shortcuts \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build-ios.log
      - name: Package unsigned test IPA
        run: |
          mkdir -p test-ipa/Payload
          cp -R build-shortcuts/Build/Products/Release-iphoneos/SideInstaller.app test-ipa/Payload/
          cd test-ipa
          zip -qry ../SideInstaller-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SideInstaller-build
          path: |
            build-ios.log
            SideInstaller-unsigned.ipa
          if-no-files-found: ignore
